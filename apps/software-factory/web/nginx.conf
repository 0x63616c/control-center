# Serves the console's static Vite bundle and proxies /api -> the factory
# API's in-cluster Service (ADR-0012 "Exposure and authentication": one
# hostname, same origin, no CORS, one Access application covering both).
#
# The Service/port below do not exist yet , this ticket (#553) builds the
# console skeleton only, no Pulumi, no Service (that is the next ticket). The
# name `api` in the `software-factory` namespace and the port are what ADR-0012
# specifies; the deploy ticket is what makes them real.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other paths serve the SPA, fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
