components:
  schemas:
    AttemptOutput:
      additionalProperties: false
      properties:
        attemptNo:
          description: Which attempt of this Step this is, starting at 1.
          format: int64
          type: integer
        cachedInputTokens:
          description: The part of inputTokens served from the provider's prompt cache. Null when measured is false.
          format: int64
          type:
            - integer
            - "null"
        effort:
          description: The reasoning effort this attempt ran on.
          type: string
        endedAt:
          description: RFC3339 UTC. Null until the attempt ends.
          type:
            - string
            - "null"
        hasTranscript:
          description: Whether a transcript is stored for this attempt.
          type: boolean
        inputTokens:
          description: The whole input, including cachedInputTokens. Null when measured is false.
          format: int64
          type:
            - integer
            - "null"
        measured:
          description: "Whether this attempt actually ran Codex. False means it resumed a stored result: the four token fields below are null, not zero, because nothing ran to measure."
          type: boolean
        model:
          description: The model this attempt ran on.
          type: string
        outputTokens:
          description: The whole output, including reasoningTokens. Null when measured is false.
          format: int64
          type:
            - integer
            - "null"
        reasoningTokens:
          description: The part of outputTokens spent reasoning. Null when measured is false.
          format: int64
          type:
            - integer
            - "null"
        result:
          description: "'', 'succeeded' or 'failed'. Empty means the attempt has not ended yet."
          enum:
            - ""
            - succeeded
            - failed
          type: string
        startedAt:
          description: RFC3339 UTC.
          type: string
      required:
        - attemptNo
        - model
        - effort
        - measured
        - inputTokens
        - cachedInputTokens
        - outputTokens
        - reasoningTokens
        - startedAt
        - endedAt
        - result
        - hasTranscript
      type: object
    BuildOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BuildOutputBody.json
          format: uri
          readOnly: true
          type: string
        version:
          description: The build version running this API.
          type: string
      required:
        - version
      type: object
    ConsoleResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConsoleResponse.json
          format: uri
          readOnly: true
          type: string
        tickets:
          items:
            $ref: "#/components/schemas/TicketSummary"
          type:
            - array
            - "null"
      required:
        - tickets
      type: object
    CreateTicketInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTicketInputBody.json
          format: uri
          readOnly: true
          type: string
        blockedBy:
          description: Tickets that must be done before this Ticket is ready.
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        body:
          description: The Ticket's supporting detail.
          type: string
        title:
          description: The concise title describing the Ticket work.
          minLength: 1
          type: string
      required:
        - title
        - body
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        reason:
          description: Stable machine-readable reason for the error.
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - reason
      type: object
    MaxInFlightInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MaxInFlightInputBody.json
          format: uri
          readOnly: true
          type: string
        maxInFlight:
          description: Maximum number of ticket runs the dispatcher may start at once.
          format: int64
          minimum: 1
          type: integer
      required:
        - maxInFlight
      type: object
    RunOutput:
      additionalProperties: false
      properties:
        endedAt:
          description: RFC3339 UTC. Null until the Run ends.
          type:
            - string
            - "null"
        failureKind:
          description: "'', 'auth', 'rate-limit' or 'other'."
          enum:
            - ""
            - auth
            - rate-limit
            - other
          type: string
        id:
          description: Temporal's run id for this Run.
          type: string
        outcome:
          description: "'', 'proposed', 'blocked', 'exhausted' or 'failed'. Empty until the Run ends."
          enum:
            - ""
            - proposed
            - blocked
            - exhausted
            - failed
          type: string
        startedAt:
          description: RFC3339 UTC.
          type: string
        steps:
          description: This Run's Steps, in pipeline order.
          items:
            $ref: "#/components/schemas/StepOutput"
          type:
            - array
            - "null"
        ticketId:
          description: The Ticket this Run belongs to.
          format: int64
          type: integer
        usage:
          $ref: "#/components/schemas/UsageOutput"
          description: Rolled up across this Run's Steps.
      required:
        - id
        - ticketId
        - startedAt
        - endedAt
        - outcome
        - failureKind
        - steps
        - usage
      type: object
    StateTicketInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StateTicketInputBody.json
          format: uri
          readOnly: true
          type: string
        state:
          description: "The lifecycle state: open, active, working, review, done, or failed. Active is owned by a target Run; working and review belong to the legacy workflow."
          type: string
      required:
        - state
      type: object
    StepOutput:
      additionalProperties: false
      properties:
        attempts:
          description: This Step's attempts, oldest first. Usually one; more than one means a machine retry, not semantic re-work.
          items:
            $ref: "#/components/schemas/AttemptOutput"
          type:
            - array
            - "null"
        endedAt:
          description: RFC3339 UTC. Null while its last Attempt is still running.
          type:
            - string
            - "null"
        stage:
          description: plan, implement, or review.
          enum:
            - plan
            - implement
            - review
          type: string
        startedAt:
          description: RFC3339 UTC. Its first Attempt's start.
          type: string
        turn:
          description: "Which turn of Stage this is within the Run, starting at 1 — the headline number: the model was asked to do this work again."
          format: int64
          type: integer
        usage:
          $ref: "#/components/schemas/UsageOutput"
          description: Rolled up across this Step's Attempts.
      required:
        - stage
        - turn
        - startedAt
        - endedAt
        - attempts
        - usage
      type: object
    TicketResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TicketResponse.json
          format: uri
          readOnly: true
          type: string
        blockers:
          description: Tickets that must be done before this Ticket is ready.
          items:
            $ref: "#/components/schemas/TicketSummary"
          type:
            - array
            - "null"
        blocks:
          description: Tickets this Ticket prevents from becoming ready.
          items:
            $ref: "#/components/schemas/TicketSummary"
          type:
            - array
            - "null"
        body:
          description: The Ticket's supporting detail.
          type: string
        createdAt:
          description: The Ticket creation time in RFC3339 UTC.
          type: string
        id:
          description: The Ticket identifier.
          format: int64
          type: integer
        ready:
          description: Whether this open Ticket has only done dependencies.
          type: boolean
        state:
          description: The Ticket lifecycle state.
          type: string
        title:
          description: The Ticket title.
          type: string
        updatedAt:
          description: The Ticket's latest update time in RFC3339 UTC.
          type: string
      required:
        - id
        - title
        - body
        - state
        - ready
        - blockers
        - blocks
        - createdAt
        - updatedAt
      type: object
    TicketRunsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TicketRunsOutputBody.json
          format: uri
          readOnly: true
          type: string
        runs:
          description: This Ticket's Runs, most recent first.
          items:
            $ref: "#/components/schemas/RunOutput"
          type:
            - array
            - "null"
      required:
        - runs
      type: object
    TicketSummary:
      additionalProperties: false
      properties:
        createdAt:
          description: The Ticket creation time in RFC3339 UTC.
          type: string
        id:
          description: The Ticket identifier.
          format: int64
          type: integer
        ready:
          description: Whether this open Ticket has only done dependencies.
          type: boolean
        state:
          description: The Ticket lifecycle state.
          type: string
        title:
          description: The Ticket title.
          type: string
        updatedAt:
          description: The Ticket's latest update time in RFC3339 UTC.
          type: string
      required:
        - id
        - title
        - state
        - ready
        - createdAt
        - updatedAt
      type: object
    TicketsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TicketsOutputBody.json
          format: uri
          readOnly: true
          type: string
        tickets:
          description: Tickets matching the requested filters.
          items:
            $ref: "#/components/schemas/TicketSummary"
          type:
            - array
            - "null"
      required:
        - tickets
      type: object
    UsageOutput:
      additionalProperties: false
      properties:
        cachedInputTokens:
          description: The part of inputTokens served from the provider's prompt cache.
          format: int64
          type: integer
        complete:
          description: False when this total omits at least one unmeasured Attempt; render it as incomplete rather than a confident sum.
          type: boolean
        inputTokens:
          description: The whole input, including cachedInputTokens.
          format: int64
          type: integer
        outputTokens:
          description: The whole output, including reasoningTokens.
          format: int64
          type: integer
        reasoningTokens:
          description: The part of outputTokens spent reasoning.
          format: int64
          type: integer
      required:
        - inputTokens
        - cachedInputTokens
        - outputTokens
        - reasoningTokens
        - complete
      type: object
  securitySchemes:
    cloudflareAccess:
      description: Cloudflare Access JWT assertion.
      in: header
      name: Cf-Access-Jwt-Assertion
      type: apiKey
    inClusterBearer:
      description: Static bearer for in-cluster worker or sandbox callers.
      scheme: bearer
      type: http
info:
  title: Software Factory API
  version: development
openapi: 3.1.0
paths:
  /v1/build:
    get:
      operationId: get-v1-build
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get v1 build
  /v1/console:
    get:
      description: Returns the factory Tickets for the console.
      operationId: get-v1-console
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read console snapshot
  /v1/factory/max-in-flight:
    post:
      description: Success means Temporal accepted the UpdateConfig signal. The dispatcher applies this configuration on its next tick; this endpoint does not poll for observable state.
      operationId: post-v1-factory-max-in-flight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxInFlightInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set factory max in flight
  /v1/factory/pause:
    post:
      description: Success means Temporal accepted the UpdateConfig signal. The dispatcher applies this configuration on its next tick; this endpoint does not poll for observable state.
      operationId: post-v1-factory-pause
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pause the factory
  /v1/factory/resume:
    post:
      description: Success means Temporal accepted the UpdateConfig signal. The dispatcher applies this configuration on its next tick; this endpoint does not poll for observable state.
      operationId: post-v1-factory-resume
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resume the factory
  /v1/tickets:
    get:
      description: Lists Tickets with optional state and derived ready filters.
      operationId: get-v1-tickets
      parameters:
        - description: Limit results to this lifecycle state.
          explode: false
          in: query
          name: state
          schema:
            description: Limit results to this lifecycle state.
            type: string
        - description: "Limit results by derived readiness: true or false."
          explode: false
          in: query
          name: ready
          schema:
            description: "Limit results by derived readiness: true or false."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List Tickets
    post:
      description: Files a new open Ticket.
      operationId: post-v1-tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a Ticket
  /v1/tickets/{ticketID}:
    get:
      description: Returns the Ticket, both dependency directions, and derived readiness.
      operationId: get-v1-tickets-by-ticket-id
      parameters:
        - description: The Ticket identifier.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier.
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a Ticket
  /v1/tickets/{ticketID}/blockers/{blockerTicketID}:
    delete:
      description: Removes a dependency edge when it exists.
      operationId: delete-v1-tickets-by-ticket-id-blockers-by-blocker-ticket-id
      parameters:
        - description: The Ticket identifier that is blocked.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier that is blocked.
            format: int64
            minimum: 1
            type: integer
        - description: The Ticket identifier that must be done first.
          in: path
          name: blockerTicketID
          required: true
          schema:
            description: The Ticket identifier that must be done first.
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a Ticket blocker
    put:
      description: Records that the first Ticket is blocked by the second.
      operationId: put-v1-tickets-by-ticket-id-blockers-by-blocker-ticket-id
      parameters:
        - description: The Ticket identifier that is blocked.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier that is blocked.
            format: int64
            minimum: 1
            type: integer
        - description: The Ticket identifier that must be done first.
          in: path
          name: blockerTicketID
          required: true
          schema:
            description: The Ticket identifier that must be done first.
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a Ticket blocker
  /v1/tickets/{ticketID}/cancel:
    post:
      description: Success means Temporal accepted cancellation of the ticket workflow. This endpoint does not wait for cleanup or database state to become observable.
      operationId: post-v1-tickets-by-ticket-id-cancel
      parameters:
        - description: The ticket number whose run is being commanded.
          in: path
          name: ticketID
          required: true
          schema:
            description: The ticket number whose run is being commanded.
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cancel a ticket run
  /v1/tickets/{ticketID}/runs:
    get:
      description: Returns every Run of the Ticket, most recent first, each with its Steps and Attempts and rolled-up token usage.
      operationId: get-v1-tickets-by-ticket-id-runs
      parameters:
        - description: The Ticket identifier.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier.
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRunsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a Ticket's Runs
  /v1/tickets/{ticketID}/runs/{runID}/stages/{stage}/turns/{turn}/attempts/{attemptNo}/transcript:
    get:
      description: Returns the Attempt's raw JSONL event stream, decompressed, as a downloadable file.
      operationId: list-v1-tickets-by-ticket-id-runs-by-run-id-stages-by-stage-turns-by-turn-attempts-by-attempt-no-transcript
      parameters:
        - description: The Ticket identifier.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier.
            format: int64
            minimum: 1
            type: integer
        - description: The Run's Temporal run id.
          in: path
          name: runID
          required: true
          schema:
            description: The Run's Temporal run id.
            type: string
        - description: The Stage of the Step this Attempt belongs to.
          in: path
          name: stage
          required: true
          schema:
            description: The Stage of the Step this Attempt belongs to.
            enum:
              - plan
              - implement
              - review
            type: string
        - description: The Step's turn number.
          in: path
          name: turn
          required: true
          schema:
            description: The Step's turn number.
            format: int64
            minimum: 1
            type: integer
        - description: Which attempt of the Step to download.
          in: path
          name: attemptNo
          required: true
          schema:
            description: Which attempt of the Step to download.
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download an Attempt's transcript
  /v1/tickets/{ticketID}/state:
    patch:
      description: Moves a Ticket through its legal lifecycle transitions.
      operationId: patch-v1-tickets-by-ticket-id-state
      parameters:
        - description: The Ticket identifier.
          in: path
          name: ticketID
          required: true
          schema:
            description: The Ticket identifier.
            format: int64
            minimum: 1
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateTicketInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update Ticket state
  /v1/tickets/{ticketID}/work:
    post:
      description: Success means Temporal accepted an empty UpdateConfig signal that wakes the dispatcher without changing configuration. This endpoint does not poll for observable state.
      operationId: post-v1-tickets-by-ticket-id-work
      parameters:
        - description: The ticket number whose run is being commanded.
          in: path
          name: ticketID
          required: true
          schema:
            description: The ticket number whose run is being commanded.
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Nudge the factory
security:
  - cloudflareAccess: []
  - inClusterBearer: []
