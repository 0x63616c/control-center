# Serves manage's static Vite bundle. No API, no proxying: manage has no
# backend, no session store and no database (ADR-0010). Cloudflare Access is the
# only gate in front of it, and every tool it frames authenticates for itself.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # manage frames other origins; it is never framed itself.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
