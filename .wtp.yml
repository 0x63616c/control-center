version: "1.0"

# Worktrees live outside the repo tree entirely (never nested under
# .claude/worktrees/ or any repo subfolder) so lefthook, glob-based tooling,
# and gitignore scoping never get confused by a nested checkout. See
# https://github.com/0x63616c/world-wide-webb/issues/182.
defaults:
  base_dir: "/Users/calum/.worktrees/world-wide-webb"

hooks:
  post_create:
    # A branch created from origin/main inherits main as its upstream. Run this
    # safety repair before any fallible setup step; the branch is not on origin
    # yet, so configure its eventual same-named ref directly rather than using
    # `git branch --set-upstream-to`.
    - type: command
      command: "bash scripts/configure-worktree-upstream.sh"

    # This repo has no .env — local dev env comes from scripts/secrets.sh at
    # runtime, never a dotenv file (see AGENTS.md). A wtp hook that copies a
    # nonexistent file aborts every later hook in the chain, so the essential
    # setup steps run before the optional per-machine copy.
    - type: command
      command: "bun install"

    - type: command
      command: "bunx lefthook install --force"

    # Per-machine Claude Code permission grants (gitignored). Not present on
    # every machine — kept last so its absence doesn't block bun install /
    # lefthook above.
    - type: copy
      from: ".claude/settings.local.json"
      to: ".claude/settings.local.json"
