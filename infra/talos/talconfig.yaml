# Talos machine config for the homelab cluster, rendered by talhelper.
# Single control-plane node `home-server` (MSI PRO Z690-A, amd64, RTX 3060).
#
# Disk is UNENCRYPTED by design (no TPM / Secure Boot / UKI on this box). See
# README.md for the full rationale and the Image Factory schematic this config
# pins.
#
# Render:   talhelper genconfig
# Validate: scripts/test-talos-config.sh (talhelper genconfig + talosctl validate)
# Secrets:  talsecret.sops.yaml (SOPS+age encrypted, see README.md)

clusterName: prod
talosVersion: v1.13.7
kubernetesVersion: v1.36.2 # Talos v1.13.7 default target (pkg/machinery/constants)
endpoint: https://home-server.tail8c014d.ts.net:6443 # tailnet name, NOT homelab (P5)

nodes:
  - hostname: home-server
    ipAddress: 192.168.0.5
    controlPlane: true
    installDisk: /dev/nvme0n1
    # Plain (non-SecureBoot, non-UKI) Image Factory schematic. talhelper hashes
    # this customization block into the schematic ID at genconfig time (POSTs
    # to factory.talos.dev unless run with --offline-mode); the resulting ID
    # for this exact extension set + v1.13.7 is recorded in README.md and MUST
    # match after any edit here.
    #
    # siderolabs/kata-containers (program handoff step 1 of the software-factory
    # migration, /tmp/handoffs/2026-07-29-software-factory-migration-program.md):
    # gives Kata VM-isolated containers a `kata`/`kata-qemu` containerd runtime
    # handler, for later scheduling of untrusted software-factory agent work
    # into VM-isolated pods (see infra/src/kata.ts's RuntimeClass). Editing this
    # list alone does NOTHING live , it changes machine.install.image, which
    # only takes effect after a `talosctl upgrade` + reboot (infra/talos/README.md's
    # Image Factory schematic section documents the exact upgrade command). New
    # schematic ID for this extended list: see README.md.
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/nonfree-kmod-nvidia-production
            - siderolabs/nvidia-container-toolkit-production
            - siderolabs/iscsi-tools
            - siderolabs/nfs-utils
            - siderolabs/tailscale
            - siderolabs/kata-containers
    networkInterfaces:
      - interface: enp4s0 # 2.5GbE NIC — confirmed on hardware 2026-07-24 via `talosctl get links` (MAC d8:bb:c1:df:7d:19)
        dhcp: false # CRITICAL: Talos defaults physical links to DHCP. Without this,
                    # the node runs static .5 AND a DHCP lease at once (Talos docs:
                    # "wouldn't work correctly"), and a networkd reconcile drops the
                    # static .5 leaving only the DHCP address -> control plane (certs
                    # pinned to .5) dies. Pure-static kills the drift entirely.
        addresses:
          - 192.168.0.5/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.0.1
    nameservers:
      - 192.168.0.1 # UniFi gateway (also DNS resolver on this LAN)

patches:
  - |-
    machine:
      certSANs: [home-server.tail8c014d.ts.net, 192.168.0.5]
      network:
        # `endpoint:` above is the node's own tailnet MagicDNS name, but the
        # node's only resolver is the UniFi gateway (nameservers above), which
        # knows nothing about `.ts.net`. Talos' own k8s.StaticEndpointController
        # and k8s.EndpointController resolve `endpoint` on the HOST — so they
        # failed every ~15s forever with `lookup home-server.tail8c014d.ts.net
        # on 127.0.0.53:53: no such host` (GH #91). Cluster stayed healthy; it
        # was a resolution gap, not an outage.
        #
        # Fixed with a static host entry rather than adding tailscale MagicDNS
        # (100.100.100.100) to `nameservers:`: a MagicDNS resolver would put ALL
        # host DNS behind tailscaled being up, so an extension restart or an
        # expired auth key would take out NTP, the image registry, and boot-time
        # resolution too. A hosts entry has no such dependency. The address is
        # this node's stable tailnet IPv4 (`talosctl get addresses` ->
        # tailscale0); it only changes if the node is removed from the tailnet
        # and re-registered, which also invalidates `endpoint` anyway.
        extraHostEntries:
          # NOTE: this is the node's tailnet IPv4 and CHANGES whenever the
          # node re-registers (e.g. a STATE wipe re-auths with TS_AUTHKEY and
          # mints a NEW tailscale identity — happened at the ADR-0009 cutover:
          # old node left an offline corpse holding the name; delete it in the
          # admin console, rename the new one back, and update this IP).
          - ip: 100.76.3.102
            aliases:
              - home-server.tail8c014d.ts.net
              - home-server
      # NVIDIA (RTX 3060) kernel modules. The nonfree-kmod-nvidia-production +
      # nvidia-container-toolkit-production system extensions (schematic above)
      # ship the .ko files, but Talos only auto-loads modules listed here — so
      # without this block the driver never binds (`/proc/driver/nvidia` absent)
      # and the k8s device plugin finds no GPU. Loaded at boot, so applying this
      # reboots the node. nvidia_uvm = CUDA, nvidia_drm/modeset = NVENC/NVDEC
      # (Plex hardware transcode). Prereq for the nvidia RuntimeClass + device
      # plugin the cluster uses to schedule Plex on the GPU.
      kernel:
        modules:
          - name: nvidia
          - name: nvidia_uvm
          - name: nvidia_drm
          - name: nvidia_modeset
      # NTP: this box has no reliable RTC across hard power cuts. If the clock
      # resets on boot, Talos' PKI certs look "not yet valid" and apid refuses to
      # start (node pings but no services). Sync fast + hard from the LAN gateway
      # so services come up cleanly after any power loss.
      time:
        servers:
          - 192.168.0.1
          - time.cloudflare.com
      sysctls:
        fs.inotify.max_user_watches: "1048576"
        fs.inotify.max_user_instances: "8192"
      logging: {}
      # NO systemDiskEncryption — disk is UNENCRYPTED (locked; no TPM/SecureBoot/UKI).
    cluster:
      discovery: { enabled: false }
      allowSchedulingOnControlPlanes: true
      network:
        cni:
          name: flannel
          flannel:
            # Talos 1.13 ships kube-network-policies behind this explicit
            # switch. Without it, Kubernetes accepts NetworkPolicy objects but
            # Flannel does not enforce them, which makes a successful apply a
            # dangerously misleading security signal.
            kubeNetworkPoliciesEnabled: true
  # Tailscale extension runtime config. Top-level document (ExtensionServiceConfig
  # is not a `machine:` sub-key) — do not nest this under the patch above. This
  # was previously live on the node but absent here: a full (non-patch)
  # apply-config would have deleted it, dropping tailscaled's auth key and
  # taking the node off the tailnet mid-apply — which also kills the
  # `endpoint` above (resolved over Tailscale) and CI's only path to the
  # cluster. Do not remove this document; if you think it's noise, it isn't.
  - |-
    apiVersion: v1alpha1
    kind: ExtensionServiceConfig
    name: tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=home-server
  # Storage layout (ADR-0009). EPHEMERAL capped so the rest of the NVMe backs
  # LVM VG `storage` (OpenEBS LocalPV-LVM — the raw partition below is its PV).
  # The cap does NOT shrink a live partition: it takes effect only when
  # EPHEMERAL is re-provisioned, i.e. the cutover wipe
  # (docs/runbooks/local-lvm-cutover.md). Changing the cap later = another wipe.
  - |-
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      maxSize: 200GiB
  - |-
    apiVersion: v1alpha1
    kind: RawVolumeConfig
    name: storage
    provisioning:
      diskSelector:
        match: system_disk
      minSize: 500GiB
      grow: true
