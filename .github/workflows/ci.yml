name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger: rebuild + (on main) redeploy on demand. Useful for a forced
  # redeploy or to re-run after a transient infra failure. force_all=true
  # rebuilds every image and runs `pulumi up`; force_all=false falls back to the
  # path-filter diff (the www-bom8 deploy marker is retired, `pulumi up` converges
  # the declared stack on every green run, so no drift-tracking dispatch exists).
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every image and redeploy (pulumi up); false = diff-only"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# Cancellation behavior depends on the ref: cancel-in-progress is on for feature
# branches (killing superseded runs saves runner minutes) but off on main (where a
# newer push may already be deploying). On main at observed saturation (rho ~1.14),
# cancelling in-flight runs killed them before deploy and delayed commits waiting
# for others' later runs — lead time p50 was 2227s (37.1m) against a 777s (12.9m)
# pipeline. With cancellation off, GitHub keeps only the newest PENDING run per
# group and discards older pending ones, so intermediate pushes coalesce for free
# (zero compute) and the run that does start carries all of their commits. On
# feature branches, cancellation remains enabled; superseding is the right behavior
# there and nothing deploys from them (www-c0m).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Determine which apps actually changed so we only rebuild what's needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      manage: ${{ steps.filter.outputs.manage }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      temporalworker: ${{ steps.filter.outputs.temporalworker }}
      mapprovision: ${{ steps.filter.outputs.mapprovision }}
      dont_text_your_ex: ${{ steps.filter.outputs.dont_text_your_ex }}
      # infra-only changes (Pulumi program / specs) deploy without any image
      # rebuild: a `pulumi up` must still converge the declared stack.
      infra: ${{ steps.filter.outputs.infra }}
      # infra/cloudflare is a separate Pulumi project (ticket #52): its own
      # filter so it deploys independently of the home-server `infra` stack.
      cloudflareinfra: ${{ steps.filter.outputs.cloudflareinfra }}
      any_app: ${{ steps.filter.outputs.any_app }}
    steps:
      - uses: actions/checkout@v5

      # No deploy-marker baseline (www-j934.14): `pulumi up` is
      # declarative-convergent, so the latest green run always reconciles the
      # whole declared stack to the committed digests, the `refs/deploy/main`
      # marker that kept Swarm's push-range model from stranding commits is
      # obsolete. dorny defaults to the push range on same-branch pushes and the
      # default-branch diff on feature branches, which is exactly what we want.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Shared changes (packages or root lockfile) force a rebuild of everything.
            # Single-product repo now (SDD track 0, Task 9: flatten): each app
            # lane is scoped to its own root directory plus shared packages.
            # app-kit/ + features/ are the C7 authoring surface: web bundles feature
            # tiles, api mounts feature routers/schema, worker drains feature jobs.
            # A change under either must rebuild ALL THREE images (a miss ships stale
            # images on green CI — www ci-cancelled-runs-strand).
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'app-kit/**'
              - 'features/**'
              - 'bun.lock'
            # manage (ADR-0010) shares only packages/theme with the rest of the
            # repo — no app-kit, no features, no api surface — so its lane is
            # its own tree plus packages/ and the lockfile.
            manage:
              - 'apps/manage/**'
              - 'packages/**'
              - 'bun.lock'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'app-kit/**'
              - 'features/**'
              - 'bun.lock'
            # The worker bundles its domain cycles from @control-center/api, so an api/
            # change must rebuild the worker image too (www-xjba).
            worker:
              - 'apps/worker/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'app-kit/**'
              - 'features/**'
              - 'bun.lock'
            # The Temporal worker serves feature-declared workflows/activities
            # (ADR-0008), so its build surface includes the feature tree and
            # the shared packages their activities import.
            temporalworker:
              - 'apps/temporal-worker/**'
              - 'app-kit/**'
              - 'features/**'
              - 'packages/**'
              - 'bun.lock'
            # infra-only changes (the Pulumi program + workload specs) deploy
            # with NO image rebuild: the deploy job runs `pulumi up`, which must
            # converge an infra-only diff (e.g. a resource cap or env change).
            infra:
              - 'infra/**'
            # infra/cloudflare (ticket #52): the Cloudflare edge project (Access
            # apps + tunnel ingress + DNS), separate from the home-server `infra`
            # stack above. Also watch packages/platform/src/index.ts: its
            # controlCenterProductManifest() feeds desiredAccessApps() (src/access.ts)
            # and productRoutes() (src/routes.ts), so a manifest-only change with
            # no infra/cloudflare/ diff must still redeploy.
            cloudflareinfra:
              - 'infra/cloudflare/**'
              - 'packages/platform/src/index.ts'
            # Basemap provisioner (www-hn1i): a self-contained alpine + pmtiles
            # CLI + sh image, no workspace deps, so it rebuilds solely on its
            # own tree.
            mapprovision:
              - 'apps/map-provision/**'
            # Don't Text Your Ex ships as two images from one standalone app
            # tree; changes to shared packages or the lockfile rebuild both.
            dont_text_your_ex:
              - 'apps/dont-text-your-ex/**'
              - 'packages/**'
              - 'bun.lock'
            # any_app is true when at least one TypeScript-workspace image
            # needs to be built. An infra-only change is handled by the separate
            # `infra` filter above. Software-factory source and image builds
            # live in the standalone repository; this workflow only verifies
            # and deploys its pinned immutable release from `infra/**`.
            any_app:
              - 'apps/web/**'
              - 'apps/manage/**'
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'apps/temporal-worker/**'
              - 'apps/map-provision/**'
              - 'apps/dont-text-your-ex/**'
              - 'packages/**'
              - 'app-kit/**'
              - 'features/**'
              - 'bun.lock'

  # Unit suite (jsdom) + all the fast hermetic bash guards. Split from the
  # Storybook browser suite so the two run concurrently: they share nothing, and
  # sequentially they cost sum(218s, 174s) instead of max(). The guards live
  # here because this job needs no Playwright install, which keeps the two
  # halves roughly balanced.
  test-unit:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Lint (biome)
        # Lint gate in CI, not just the lefthook pre-commit hook: a --no-verify
        # bypass (or a hook that isn't installed on a contributor's machine)
        # would otherwise ship lint regressions undetected (www-355t.6).
        run: bun run lint
      - name: Storybook docs guard
        # Authoritative backstop for the lefthook pre-commit `storybook-docs`
        # hook (bypassable with --no-verify): fails the test job if any tracked
        # *.stories.tsx lacks an autodocs Docs page. `deploy-home-server` needs `test-unit`, so a
        # missing doc blocks the deploy. Fast (grep), runs before the slow
        # Playwright install so it fails early (www-o0ko).
        run: bash scripts/check-storybook-docs.sh
      - name: Alias parity guard
        # Static backstop (Track C, C7): the @app-kit / @app-kit/server /
        # @features authoring-surface aliases must be declared identically
        # across all 8 resolver configs (tsconfig `paths` + vite/vitest
        # resolve.alias), or a module resolves in one tool and not another.
        # Fast (grep), runs alongside the other hermetic guards.
        run: bash scripts/check-alias-parity.sh
      - name: OrbStack watchdog logic tests
        # Hermetic self-test of the docker-hang watchdog's decide/probe logic
        # (www-sizh), no real docker/OrbStack. Gates the recovery automation so a
        # regression in its thresholds/anti-loop guard can't ship silently. Fast
        # (bash), runs before the slow Playwright install. Mirrors the
        # test-kiosk-health gate in ios-build.yml.
        run: bash scripts/test-orbstack-watchdog.sh
      - name: Basemap provisioner tests
        # Hermetic self-test of the map-provision script (www-hn1i): runtime
        # build resolution (no date pin to rot), if-missing/force modes, the
        # newest→previous fallback, atomic rename, and the nginx /maps/ loud-404.
        # Stubbed curl/pmtiles, no network. Fast (bash), runs before the slow
        # Playwright install. Mirrors the orbstack-watchdog gate above.
        run: bash scripts/test-map-provision.sh
      - name: Dockerfile manifest coverage guard
        run: bun run test:dockerfile-manifests
      - name: Embedded software-factory ownership guard
        run: bash scripts/test-no-embedded-software-factory.sh
      - name: Codex credential seed checker tests
        # Hermetic checks for the operator-facing --check command, including
        # the worker-owned refresh lease written after a healthy use.
        run: bash scripts/test-seed-codex-auth.sh
      - name: Deploy gate guard
        # Everything CI builds, CI must also deploy. Found live on #355: a tree
        # with its own path filter and its own build jobs, named in no term of
        # deploy-home-server's `if:` — so it built, tested and merged green and
        # never reached prod, with nothing red anywhere to say so. Checks by
        # PATH, not by filter name, since `any_app` legitimately covers several
        # trees. Fast (grep/awk), sibling of the build matrix guard below.
        run: bash scripts/test-deploy-gate.sh
      - name: Build matrix guard
        # Asserts every product image builds on a NATIVE amd64 runner and that
        # no arm64 leg or QEMU emulation creeps back in. The home-server Talos
        # node is the only deploy target and is x86.
        run: bash scripts/test-build-matrix.sh
      - name: Don't Text Your Ex Temporal contract guard
        run: bash scripts/test-dtye-temporal-contract.sh
      - name: Software-factory image CI coverage guard
        # `infra/src/services.ts` is the source of truth for factory images.
        # Every entry needs both a producer and a digest collector: without
        # either, prod's required-pin check turns a green merge into a failed
        # deploy, or worse, a target image is never published at all.
        run: bash scripts/test-software-factory-image-ci.sh
      - name: Software-factory release manifest contract
        # The standalone release is the producer after extraction. Before the
        # cutover consumes its artifact, prove that only the exact seven
        # linux/amd64 repositories and immutable digests can enter Pulumi's map.
        run: |
          bash scripts/test-software-factory-release-manifest.sh
          bash scripts/test-verify-software-factory-release.sh
      - name: Control Center cutover tooling tests
        # Hermetic self-tests of the M7 production-cutover tooling (www-jtp0.7):
        # the red-first preflight gate (refuses cutover until rehearsal/snapshot/
        # counts/rollback/approval present), the post-cutover smoke dry-run plan,
        # the CNPG local-name cleanup guard, and the wall-panel health classifier
        # (1366x1024 + CF-error/skeleton markers, mirrored from iOS KioskHealth).
        # No cluster/DB/network/secrets. Fast, runs before the slow Playwright
        # install. Mirrors the gates above.
        run: |
          bash scripts/test-cc-cutover-preflight.sh
          bash scripts/test-cc-post-cutover-smoke.sh
          bash scripts/test-cnpg-local-name-preflight.sh
          node scripts/test-panel-health.mjs
      - name: Test (unit, jsdom)
        run: bun run test:unit
      - name: Guest listener smoke (real Bun.serve + TLS sockets)
        # The vitest `startGuestServer` integration block is Bun-runtime-gated
        # (skipIf no `Bun` global, since this repo's `bunx vitest run` forks a
        # plain node process); this script is the actual executing coverage
        # for that wiring (real HTTPS/plain-HTTP sockets, self-signed cert via
        # the system openssl). Task 4 (SDD track 0) cutover note: gates the
        # guest listener that's about to carry live LAN guest traffic.
        run: bun run --cwd apps/api test:guest-smoke

  # Storybook browser suite (Playwright/Chromium play functions). Runs
  # concurrently with test-unit. Kept as its own job because it needs a Chromium
  # install that the jsdom suite does not.
  test-storybook:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system deps (cached binary)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Test (Storybook, chromium)
        run: bun run test:storybook

  # Don’t Text Your Ex has a real Postgres contract and restored browser suite.
  # Keep it separate from the hermetic root unit lane: the database service and
  # Chromium install are product-specific, and a changed product must never go
  # green because its integration tests silently skipped without DATABASE_URL.
  test-dont-text-your-ex:
    needs: [changes]
    if: needs.changes.outputs.dont_text_your_ex == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dont_text_your_ex_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dont_text_your_ex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dont_text_your_ex_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Test API contracts against Postgres
        run: bun run --cwd apps/dont-text-your-ex/apps/api test
      - name: Test product Temporal worker
        run: bun run --cwd apps/dont-text-your-ex/apps/temporal-worker test
      - name: Test shared Temporal runtime
        run: bun run --cwd packages/temporal-runtime test
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: dont-text-your-ex-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: dont-text-your-ex-playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            dont-text-your-ex-playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.dont-text-your-ex-playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system deps (cached binary)
        if: steps.dont-text-your-ex-playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Test restored end-to-end flows
        run: bun run --cwd apps/dont-text-your-ex test:e2e

  # Typecheck + dead-code run in parallel with the test suite so type
  # errors and knip regressions surface without waiting for Playwright to
  # install and all tests to run. `deploy-home-server` depends on `test-unit`,
  # `test-storybook`, `test-dont-text-your-ex`, and `typecheck` all passing
  # (www-q2p5). Build jobs do
  # NOT — they gate on `changes` alone, so they run concurrently with these.
  typecheck:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Check committed app codegen
        # This is the authoritative backstop for committed App and manage-extension
        # codegen: a local hook is bypassable, and deploy-home-server needs typecheck.
        run: bun run apps:check
      - name: Typecheck
        run: bun run typecheck
      - name: Dead code (knip, zero-tolerance)
        # Authoritative backstop for the lefthook pre-push guard (which a
        # --no-verify bypass or an uninstalled hook can skip). Export-level checks
        # are disabled in the shared script because Temporal registers runtime
        # activity/workflow exports dynamically by name.
        # `deploy-home-server` needs `typecheck`, so a regression blocks the prod deploy (www-k6p1).
        run: bun run knip

  # Stable target-policy check consumed by the standalone AgentWorkflow. This
  # no longer builds or tests embedded product source: it is a WWW fan-in plus
  # the retained consumer-boundary assertion. Keeping the context stable avoids
  # stranding in-flight and newly dispatched Tickets during repository cutover.
  test-software-factory:
    needs: [test-unit, test-storybook, typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require WWW quality gates
        env:
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_STORYBOOK_RESULT: ${{ needs.test-storybook.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          test "$TEST_UNIT_RESULT" = success
          test "$TEST_STORYBOOK_RESULT" = success
          test "$TYPECHECK_RESULT" = success
      - name: Prove the embedded product remains absent
        run: bash scripts/test-no-embedded-software-factory.sh

  # Build jobs depend on `changes` ONLY, not on test/typecheck. They run
  # concurrently with the test suite instead of queueing behind it (measured
  # 180s off the critical path, because the build fan-in is shorter than the
  # test job and now hides entirely under it).
  # This does NOT weaken the deploy gate: `deploy-home-server` still lists test-unit + test-storybook + test-dont-text-your-ex + typecheck
  # in its own `needs:`, so an image built for a commit that fails tests is
  # simply never deployed. The only cost is building images for the ~9% of
  # pushes that fail — they are content-addressed and otherwise inert.
  # Each build-* job builds its Dockerfile ONCE, linux/amd64 only, on a native
  # ubuntu-24.04 runner, and pushes the final tags directly (…:<sha>, plus
  # …:main on main). The arm64 leg and the merge-* manifest-index jobs were
  # dropped when the arm64 Mac mini was retired (2026-07-25) — the home-server
  # Talos node is x86 and is the only deploy target. No setup-qemu-action
  # anywhere: the runner is native, so bun builds never emulate.
  build-web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # The Docker builder image has no .git, so the commit timestamp must be
      # computed here (where the repo is checked out) and passed in as a build-arg.
      # Unix-ms = author commit time × 1000; the badge renders "time since commit"
      # from it. Without this, vite emits "NaN" and the prod badge omits the age.
      - name: Resolve commit timestamp (unix-ms)
        run: echo "BUILD_TIME=$(( $(git show -s --format=%ct HEAD) * 1000 ))" >> "$GITHUB_ENV"

      - name: Build and push web image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-web
          dockerfile: apps/web/Dockerfile
          cache-scope: web
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}


  build-manage:
    needs: [changes]
    if: needs.changes.outputs.manage == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push manage image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-manage
          dockerfile: apps/manage/Dockerfile
          cache-scope: manage


  build-api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push api image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-api
          dockerfile: apps/api/Dockerfile
          cache-scope: api
          build-args: |
            BUILD_HASH=${{ github.sha }}


  build-worker:
    needs: [changes]
    if: needs.changes.outputs.worker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push worker image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-worker
          dockerfile: apps/worker/Dockerfile
          cache-scope: worker


  build-temporal-worker:
    needs: [changes]
    if: needs.changes.outputs.temporalworker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push temporal-worker image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-temporal-worker
          dockerfile: apps/temporal-worker/Dockerfile
          cache-scope: temporal-worker


  build-map-provision:
    needs: [changes]
    if: needs.changes.outputs.mapprovision == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push map-provision image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-control-center-map-provision
          dockerfile: apps/map-provision/Dockerfile
          cache-scope: map-provision


  build-dont-text-your-ex-frontend:
    needs: [changes]
    if: needs.changes.outputs.dont_text_your_ex == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push Don't Text Your Ex frontend image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-dont-text-your-ex-frontend
          dockerfile: apps/dont-text-your-ex/Dockerfile.frontend
          cache-scope: dont-text-your-ex-frontend
          build-args: |
            VITE_API_BASE=https://dont-text-your-ex.worldwidewebb.co


  build-dont-text-your-ex-api:
    needs: [changes]
    if: needs.changes.outputs.dont_text_your_ex == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build and push Don't Text Your Ex API image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-dont-text-your-ex-api
          dockerfile: apps/dont-text-your-ex/Dockerfile.api
          cache-scope: dont-text-your-ex-api

  build-dont-text-your-ex-temporal-worker:
    needs: [changes]
    if: needs.changes.outputs.dont_text_your_ex == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build and push Don't Text Your Ex Temporal worker image
        uses: ./.github/actions/build-product-image
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          image: www-dont-text-your-ex-temporal-worker
          dockerfile: apps/dont-text-your-ex/Dockerfile.temporal-worker
          cache-scope: dont-text-your-ex-temporal-worker


  # After the images build on main, deploy to the home-server Talos cluster with
  # `pulumi up` (www-j934.14). The runner joins the tailnet with an EPHEMERAL
  # Tailscale key (auto-revoked when the job ends), reaches the kube-apiserver
  # over the tailnet, and runs the Pulumi program in infra/. CI is the deployer.
  #
  # Fires on `any_app || infra`: an application change or an infra-only change
  # must converge the declared stack. Software-factory images are independently
  # released and arrive here only through the pinned release lock under infra/.
  deploy-home-server:
    needs:
      [
        changes,
        test-unit,
        test-storybook,
        test-dont-text-your-ex,
        typecheck,
        test-software-factory,
        build-web,
        build-manage,
        build-api,
        build-worker,
        build-temporal-worker,
        build-map-provision,
        build-dont-text-your-ex-frontend,
        build-dont-text-your-ex-api,
        build-dont-text-your-ex-temporal-worker,
      ]
    # always() lets us run even when some build jobs were skipped (no changes).
    # We proceed when: on main, an app OR infra changed, and no build failed.
    if: |
      always() &&
      github.ref_name == 'main' &&
      (needs.changes.outputs.any_app == 'true' || needs.changes.outputs.infra == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all)) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment (main-branch only): AGE_PRIVATE_KEY also lives as a
    # plain repo secret for the build-* jobs above, which don't deploy anything;
    # this job actually touches the cluster, so it stays gated to `production`.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Decrypt vault, the ONLY step that touches AGE_PRIVATE_KEY. Installs sops
      # + age, decrypts secrets/vault.yaml, and masks each value before exporting.
      # No set -x around this block. Values flow into subsequent steps via GITHUB_ENV.
      - name: Decrypt vault (SOPS+age)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          # Install sops
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 \
            -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops
          # Install age
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            | tar -xzC /usr/local/bin --strip-components=1 age/age age/age-keygen

          extract() { sops -d secrets/vault.yaml | grep "^$1:" | cut -d' ' -f2-; }

          TS_CLIENT_ID=$(extract TAILSCALE_OAUTH_CLIENT__CLIENT_ID)
          TS_CLIENT_SECRET=$(extract TAILSCALE_OAUTH_CLIENT__CLIENT_SECRET)
          PULUMI_TOKEN=$(extract PULUMI__ACCESS_TOKEN)
          KUBECONFIG_B64_VAL=$(extract KUBECONFIG__B64)

          GHCR_PAT_VAL=$(extract GITHUB_PERSONAL_ACCESS_TOKEN__TOKEN)
          NTFY_TOPIC_VAL=$(extract NTFY_TOPIC)

          echo "::add-mask::$TS_CLIENT_ID"
          echo "::add-mask::$TS_CLIENT_SECRET"
          echo "::add-mask::$PULUMI_TOKEN"
          echo "::add-mask::$KUBECONFIG_B64_VAL"
          echo "::add-mask::$GHCR_PAT_VAL"
          echo "::add-mask::$NTFY_TOPIC_VAL"

          echo "TS_OAUTH_CLIENT_ID=$TS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "TS_OAUTH_SECRET=$TS_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "PULUMI_ACCESS_TOKEN=$PULUMI_TOKEN" >> "$GITHUB_ENV"
          echo "KUBECONFIG_B64=$KUBECONFIG_B64_VAL" >> "$GITHUB_ENV"
          echo "GHCR_PAT=$GHCR_PAT_VAL" >> "$GITHUB_ENV"
          echo "NTFY_TOPIC=$NTFY_TOPIC_VAL" >> "$GITHUB_ENV"
          # SOPS_AGE_KEY flows into the pulumi up step via secrets.AGE_PRIVATE_KEY

      # Heads-up ping the moment the deploy actually begins (vault decrypted,
      # about to pin digests and run pulumi). min priority: no sound, just a
      # line in the ntfy list. Never fails the job.
      - name: Notify deploy start
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC not set; skipping."; exit 0; }
          curl -fsS --max-time 10 \
            -H "Title: Deploy started" \
            -H "Priority: min" \
            -H "Tags: hourglass_flowing_sand" \
            -H "Click: $RUN_URL" \
            -d "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))" \
            "https://ntfy.sh/$NTFY_TOPIC" || true

      # Read each app image's current :main digest. A pinned digest renders the
      # workload's image as @sha256:… in the Pulumi program (infra/src/services.ts
      # ghcr()), so `pulumi up` rolls ONLY the workloads whose digest changed,
      # the www-czg digest-pin guarantee, now config-driven via the Pulumi
      # program rather than an external webhook.
      - name: Log in to ghcr.io (read manifests)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_PAT }}

      - name: Collect image digests
        id: digests
        run: |
          # Map each built app image to its current :main manifest digest. The
          # KEY is product-component scoped and matches the Pulumi imageDigests
          # config key, while repo names use full product slugs.
          declare -A out=()
          for entry in www-control-center-web:control-center-web www-control-center-manage:control-center-manage www-control-center-api:control-center-api www-control-center-worker:control-center-worker www-control-center-temporal-worker:control-center-temporal-worker www-control-center-map-provision:control-center-map-provision www-dont-text-your-ex-frontend:dont-text-your-ex-frontend www-dont-text-your-ex-api:dont-text-your-ex-api www-dont-text-your-ex-temporal-worker:dont-text-your-ex-temporal-worker; do
            repo="${entry%%:*}"
            name="${entry#*:}"
            d=$(docker buildx imagetools inspect "ghcr.io/0x63616c/$repo:main" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$d" ]; then
              out[$name]="$d"
            fi
          done
          # Emit a compact JSON map (svc -> sha256:…) for the pulumi config step.
          json='{}'
          for k in "${!out[@]}"; do
            json=$(jq -cn --argjson cur "$json" --arg k "$k" --arg v "${out[$k]}" '$cur + {($k): $v}')
          done
          # Software Factory is an independently released product. Its checked
          # manifest is the immutable deployment input; WWW never substitutes
          # a locally built :main digest for a released component.
          factory_version="$(jq -er .version infra/software-factory-release.json)"
          factory_json="$(GH_TOKEN='${{ github.token }}' scripts/verify-software-factory-release.sh \
            "$factory_version" infra/software-factory-release.json)"
          json="$(jq -cn --argjson app "$json" --argjson factory "$factory_json" '$app + $factory')"
          echo "Image digests: $json"
          echo "map=$json" >> "$GITHUB_OUTPUT"

      # Join the tailnet with an EPHEMERAL, tag-scoped key so the runner can reach
      # the home-server kube-apiserver. The node is auto-revoked when the job ends
      # (ephemeral: true + the action's post-step). No long-lived tailnet creds
      # live on the runner, only the single-use OAuth-minted key.
      - name: Connect to Tailscale (ephemeral)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Ephemeral node so it's removed from the tailnet when the runner exits.
          # No `args:` — v4 passes --accept-routes itself, and repeating it here
          # makes `tailscale up` reject the whole invocation ("invalid boolean
          # flag accept-routes: flag provided multiple times").

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install infra deps
        run: bun install --frozen-lockfile

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      # Write the kubeconfig the Pulumi k8s provider uses to reach the home-server
      # kube-apiserver over the tailnet (www-j934.9 produces this secret).
      # Contract (home-server / Talos, since the OrbStack-mini cutover):
      #   - server: https://home-server.tail8c014d.ts.net:6443 - the Talos
      #     apiserver cert's certSANs include the tailnet name directly
      #     (infra/talos/talconfig.yaml), so no `tls-server-name` override or
      #     `tailscale serve` TCP forward is needed the way the old OrbStack
      #     setup required.
      #   - auth is the Talos-issued client cert/key against the Talos-generated
      #     cluster CA (not an OrbStack CA).
      # All of that lives INSIDE the vault KUBECONFIG__B64, decoded from the env.
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: pulumi up (deploy to k3s)
        working-directory: infra
        env:
          # PULUMI_ACCESS_TOKEN set by "Decrypt vault" step via GITHUB_ENV.
          # SOPS_AGE_KEY flows in here so loadVault() in program.ts can decrypt.
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          # No KUBECONFIG override: kubectl and the Pulumi k8s provider both
          # default to $HOME/.kube/config, where the "Write kubeconfig" step put
          # it. (A `${{ env.HOME }}` expression evaluates to empty in the env
          # context, yielding /.kube/config -> "current-context is not set".)
          DIGEST_MAP: ${{ steps.digests.outputs.map }}
        run: |
          # Production is the Talos home-server cluster; the `prod` stack (the
          # retired OrbStack mini) is a cold spare and is NEVER deployed to. Its
          # cloudflared would grab the shared CF tunnel token and split-brain the
          # live tunnel, so keeping deploys off it is load-bearing, not cosmetic.
          STACK=home-server
          pulumi login
          pulumi stack select "$STACK"
          # Scope the factory's Temporal activation idempotency key to one
          # deployment attempt. A retry of this Actions run increments
          # GITHUB_RUN_ATTEMPT, while ordinary pod restarts reuse this value.
          deploy_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pulumi config set wwwinfra:softwareFactoryDeployId "$deploy_id" --stack "$STACK"
          # Pin the k8s provider to the context the CI kubeconfig actually carries,
          # read from the file itself, so the provider never falls back to a
          # local context (which resolves per-machine to a DIFFERENT cluster). The
          # CI kubeconfig holds exactly one context (home-server over the tailnet),
          # so its current-context is unambiguous. If the blob ever ships WITHOUT a
          # current-context set, self-heal by selecting its sole context, so a
          # rebuilt secret that forgot `current-context:` can't strand the deploy
          # on "current-context is not set".
          ctx=$(kubectl config current-context 2>/dev/null || true)
          if [ -z "$ctx" ]; then
            ctx=$(kubectl config get-contexts -o name | head -n1)
            kubectl config use-context "$ctx" >/dev/null
          fi
          echo "Deploying stack $STACK with kube context: $ctx"
          pulumi config set wwwinfra:kubeContext "$ctx" --stack "$STACK"
          # Pin each resolved app image by digest: a changed digest rolls only that
          # workload (www-czg). Preserve existing pins for images that were not
          # rebuilt or whose registry tag is temporarily unavailable. Removing the
          # whole map can turn one missing tag into an unpinned production workload
          # and makes Pulumi reject the entire deployment.
          # The key MUST be namespaced `wwwinfra:imageDigests` to match the program's
          # `new Config("wwwinfra").getObject("imageDigests")`. A bare `--path
          # imageDigests.<svc>` writes under the PROJECT namespace (world-wide-webb:),
          # which the program never reads, so every image silently renders `:main`
          # (mutable tag) and pods NEVER roll to the freshly built build (www-j934.9).
          for svc in $(echo "$DIGEST_MAP" | jq -r 'keys[]'); do
            dig=$(echo "$DIGEST_MAP" | jq -r --arg s "$svc" '.[$s]')
            pulumi config set --path "wwwinfra:imageDigests.$svc" "$dig" --stack "$STACK"
          done
          pulumi up --yes --stack "$STACK"

  # infra/cloudflare (ticket #52): a separate Pulumi project from the k8s stack
  # above — no LAN/tailnet dependency at all, it only talks to the Cloudflare
  # API over the internet. All its stack config (apiToken/accountId/zoneId/
  # tunnelId/allowedEmail) is already SECRET config encrypted in
  # infra/cloudflare/Pulumi.prod.yaml via Pulumi's own per-stack encryption, so
  # the only credential this job needs from the vault is PULUMI_ACCESS_TOKEN
  # (same token the home-server `deploy-home-server` job above already uses).
  #
  # Ordered AFTER deploy-home-server (needs it, not parallel): if a new
  # hostname's Cloudflare tunnel-ingress rule applied before the k8s backend
  # existed, that route would 502 for real users the moment it's live. Landing
  # k8s first means an unrouted-yet service just sits inert until this job
  # catches up — no user-facing gap either way, but this ordering is the one
  # with no failure mode.
  deploy-cloudflare:
    needs: [changes, typecheck, deploy-home-server]
    if: |
      always() &&
      github.ref_name == 'main' &&
      needs.changes.outputs.cloudflareinfra == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Decrypt only PULUMI_ACCESS_TOKEN from the vault (the sole secret this
      # job needs off the AGE key; the Cloudflare-specific config lives
      # encrypted in Pulumi.prod.yaml itself, see header comment above).
      - name: Decrypt vault (SOPS+age)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 \
            -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            | tar -xzC /usr/local/bin --strip-components=1 age/age age/age-keygen

          PULUMI_TOKEN=$(sops -d secrets/vault.yaml | grep "^PULUMI__ACCESS_TOKEN:" | cut -d' ' -f2-)
          echo "::add-mask::$PULUMI_TOKEN"
          echo "PULUMI_ACCESS_TOKEN=$PULUMI_TOKEN" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install infra deps
        run: bun install --frozen-lockfile

      - name: Test and dry-run Don't Text Your Ex edge Worker
        working-directory: infra/cloudflare
        run: bun run worker:check

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      # Wrangler owns only the Worker script + bindings. Fetch its API token
      # from the existing encrypted Pulumi config, mask it, and deploy the
      # script before Pulumi can attach the route to that script name.
      - name: Deploy Don't Text Your Ex edge Worker
        working-directory: infra/cloudflare
        run: |
          STACK=prod
          pulumi login
          pulumi stack select "$STACK"
          CLOUDFLARE_API_TOKEN=$(pulumi config get apiToken --show-secrets --stack "$STACK")
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          # Upload but do not activate a fresh emergency rollback candidate.
          # Its version ID remains in Wrangler's deployment output/history.
          bun run worker:upload:pass-through
          bun run worker:deploy

      - name: pulumi up (Cloudflare edge state)
        working-directory: infra/cloudflare
        run: |
          STACK=prod
          pulumi login
          pulumi stack select "$STACK"
          pulumi up --yes --stack "$STACK"

  # Push a phone ping via ntfy.sh when main CI fails, and a quiet "deployed"
  # ping when the deploy job succeeds. Terminal job: never fails the pipeline
  # (curl errors are swallowed), never runs off main. The topic name lives in
  # the SOPS vault (NTFY_TOPIC), so this job needs the prod environment for
  # AGE_PRIVATE_KEY, same as deploy. Docs-only pushes (deploy skipped, nothing
  # failed) send nothing.
  notify:
    needs:
      [
        changes,
        test-unit,
        test-storybook,
        test-dont-text-your-ex,
        typecheck,
        build-web,
        build-manage,
        build-api,
        build-worker,
        build-map-provision,
        deploy-home-server,
        deploy-cloudflare,
      ]
    if: always() && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Send ntfy notification
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') }}
          DEPLOY_HOME_SERVER_RESULT: ${{ needs.deploy-home-server.result }}
          DEPLOY_CLOUDFLARE_RESULT: ${{ needs.deploy-cloudflare.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$ANY_FAILED" != "true" ] \
            && [ "$DEPLOY_HOME_SERVER_RESULT" != "success" ] \
            && [ "$DEPLOY_CLOUDFLARE_RESULT" != "success" ]; then
            echo "Nothing to notify (no failure, no deploy)."
            exit 0
          fi

          # Install sops + age to read NTFY_TOPIC from the vault.
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 \
            -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            | tar -xzC /usr/local/bin --strip-components=1 age/age age/age-keygen

          TOPIC=$(sops -d secrets/vault.yaml | grep '^NTFY_TOPIC:' | cut -d' ' -f2-)
          echo "::add-mask::$TOPIC"
          if [ -z "$TOPIC" ]; then
            echo "NTFY_TOPIC not set in vault; skipping."
            exit 0
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)

          if [ "$ANY_FAILED" = "true" ]; then
            curl -fsS --max-time 10 \
              -H "Title: CI failed on main" \
              -H "Priority: high" \
              -H "Tags: rotating_light" \
              -H "Click: $RUN_URL" \
              -d "$SUBJECT ($SHORT_SHA)" \
              "https://ntfy.sh/$TOPIC" || true
          else
            curl -fsS --max-time 10 \
              -H "Title: Deployed" \
              -H "Priority: low" \
              -H "Tags: rocket" \
              -H "Click: $RUN_URL" \
              -d "$SUBJECT ($SHORT_SHA)" \
              "https://ntfy.sh/$TOPIC" || true
          fi
