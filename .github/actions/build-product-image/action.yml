name: Build and push product image (amd64)
description: Reusable amd64 product image build for CI, with shared GHCR auth/login + Buildx cache settings. Pushes the final tags directly (`:<sha>`, plus `:main` on the main branch) - there is no per-arch child tag and no manifest-merge job, because the only deploy target (the home-server Talos node) is x86.
inputs:
  image:
    description: Full image repository name without registry, e.g. www-control-center-web
    required: true
  dockerfile:
    description: Dockerfile path for the image
    required: true
  context:
    description: Build context path
    default: .
  cache-scope:
    description: Buildx cache scope string
    required: true
  build-args:
    description: Docker build args string (multiline key=value)
    required: false
runs:
  using: composite
  steps:
    - name: Resolve tags
      id: tags
      shell: bash
      run: |
        IMAGE="ghcr.io/0x63616c/${{ inputs.image }}"
        {
          echo "tags<<EOF"
          echo "$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "$IMAGE:main"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: ./.github/actions/ghcr-login
      env:
        SOPS_AGE_KEY: ${{ env.SOPS_AGE_KEY }}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        # Native amd64 runner, never QEMU-emulated: the home-server Talos node is
        # x86 and is the only deploy target (the arm64 mini was retired 2026-07-25).
        platforms: linux/amd64
        push: true
        build-args: ${{ inputs.build-args }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
